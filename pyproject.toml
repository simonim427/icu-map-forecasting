[project]
name = "icu-map-forecasting"
version = "0.1.0"
description = "Forecasting non-invasive mean arterial pressure and hypotension from irregular ICU measurements (PhysioNet 2012)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchdiffeq>=0.2.5",
    "xgboost>=3.4.1",
]
