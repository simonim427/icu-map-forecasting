[project]
name = "icu-map-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simoni Mishra", email = "simonim@bu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
icu-map-forecasting = "icu_map_forecasting:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
